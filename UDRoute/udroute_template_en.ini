;; UDRoute Configuration Template
;; ==========================================
;; Double semicolons (;;) are descriptive text. Single semicolons (;) are commented-out config options.

;; [Global Configuration]
;; DevId: Unique device identifier used by the P-Mode proxy (Auto-generated). This is the only required field!
DevId={DevId}

;; --- The following are optional configurations. The application has optimal built-in defaults. Uncomment to override. ---

;; DevName: Device name (Defaults to machine name)
    ; DevName=MyComputer
;; Port: Listening port (Default Proxy mode or local communication port is 9400)
    ; Port=9400
;; WanPort: Bound external public port (Default 0, used only with manual NAT port mapping)
    ; WanPort=0

;; LogLevel: Log output level (trace/debug/info/warn/error/none, Default warn)
    ; LogLevel=warn
;; LogType: Log output target (console/file/eventlog/default, Default default)
    ; LogType=default
;; LogFile: Custom log file path (Effective only when LogType=file)
    ; LogFile=udroute.log

;; ==========================================
;; [Proxy Relay & Security (P-Mode / Proxy)]
;; ==========================================
;; AuthMode: P-Mode authentication (none / strict / optional, Default: none)
;; none: Allow anyone to register
;; strict: Only allow authenticated S clients to register
;; optional: Allow anonymous registration, but authenticated routes cannot be overwritten by anonymous ones
    ; AuthMode=none
;; AuthFile: P-Mode password file path (Default: same name as config file but .pwd extension)
    ; AuthFile=udroute.pwd

;; AllowUnauthRelay: Whether unauthenticated S users are allowed to use P relay (default / allow / deny, Default: default)
;; default: If P has no predefined users (password file empty), allow relay; otherwise deny relay
;; allow: Always allow unauthenticated users to use P relay
;; deny: Deny unauthenticated users from using P relay, forcing direct UDP punch (closes connection if punch fails)
    ; AllowUnauthRelay=default

;; MaxUnauthNamesPerUser: Limit registered names per unauthenticated S user (Default: 20, 0 = unlimited)
    ; MaxUnauthNamesPerUser=20

;; MaxUnauthNamesTotal: Limit total registered names for all unauthenticated S users (Default: 2000, 0 = unlimited)
    ; MaxUnauthNamesTotal=2000

;; RegTimeout: Time in seconds before P-Mode considers S-Mode disconnected (Default 600)
    ; RegTimeout=600

;; IdleThreshold: Tunnel idle threshold in seconds without data (Default 60). If exceeded upon new handshake, P probes S
    ; IdleThreshold=60

;; ProbeTimeout: Timeout in seconds waiting for S health probe response (Default 5). Exceeding this marks the channel dead
    ; ProbeTimeout=5

;; MaxRecentRequests: Maximum capacity for recent request deduplication cache (Default 100, min 50). Automatically scrolls and evicts oldest generation upon reaching capacity
    ; MaxRecentRequests=100

;; KeepAlive: NAT traversal keepalive packet interval in seconds (Default 25, 0 = disabled)
;; Maintains outbound NAT mappings for S->P, C->P, and C<->S direct tunnels
    ; KeepAlive=25

;; ==========================================
;; [Authentication (S-Mode Registration to P)]
    ; target=127.0.0.1:3389/tcp
    ; server=your_proxy_ip.com
;; Whether to allow this service to be relayed through P-Mode (true/false, Default true)
;; If false, only direct UDP punching is allowed; any C-Mode ForceRelay will be ignored.
    ; allowrelay=true
;; Local override: NAT keepalive interval in seconds (Default inherits global KeepAlive)
    ; keepalive=25
;; Local Authentication: Use specific credentials to authenticate with P-Mode for this service
    ; username=rdp_user
    ; password=rdp_p_pass
;; Access Password: C-Mode clients must provide this password to bridge the data tunnel (No password required if omitted)
    ; accesspassword=rdp_client_pass
;; Use the low-latency profile optimized for RDP
    ; kcp=fast

;; Example: Publish a local Web API, optimized for request/response API patterns
    ; [web_api]
    ; target=192.168.1.100:80/tcp
    ; server=your_proxy_ip.com
    ; kcp=realtime
;; Local override: Session idle timeout to drop dead connections (Default 300)
    ; timeout=300 
;; Local override: Tunnel reuse keepalive interval in seconds (Default inherits global)
    ; TunnelReuseInterval=300 

;; Example: Publish a remote file directory (File protocol)
    ; [my_files]
    ; target=C:\Data\Shared;/file
    ; server=your_proxy_ip.com
;; Readonly mode (prevents clients from uploading files with the push command)
    ; readonly=true
;; Access Password protection (C-Mode clients must provide this password)
    ; accesspassword=SecretFilePass
