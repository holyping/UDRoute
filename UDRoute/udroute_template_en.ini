;; UDRoute Configuration Template
;; ==========================================
;; Double semicolons (;;) are descriptive text. Single semicolons (;) are commented-out config options.

;; [Global Configuration]
;; DevId: Unique device identifier used by the P-Mode proxy (Auto-generated). This is the only required field!
DevId={DevId}

;; --- The following are optional configurations. The application has optimal built-in defaults. Uncomment to override. ---

;; DevName: Device name (Defaults to machine name)
; DevName=MyComputer
;; Port: Listening port (Default Proxy mode or local communication port is 9400)
; Port=9400
;; WanPort: Bound external public port (Default 0, used only with manual NAT port mapping)
; WanPort=0

;; LogLevel: Log output level (trace/debug/info/warn/error/none, Default warn)
; LogLevel=warn
;; LogType: Log output target (console/file/eventlog/default, Default default)
; LogType=default
;; LogFile: Custom log file path (Effective only when LogType=file)
; LogFile=udroute.log

;; ==========================================
;; [Security & Authentication (P & S mode)]
;; ==========================================
;; AuthMode: P mode authentication (none / strict / optional, default: none)
;; none: Allow anyone to register
;; strict: Only allow authenticated S clients to register
;; optional: Allow anonymous registration, but authenticated routes cannot be overwritten by anonymous ones
; AuthMode=none
;; AuthFile: P mode password file path (default: same name as config file but .pwd extension)
; AuthFile=udroute.pwd

;; Username: Username used by S mode when registering to P
; Username=alice
;; Password: Password used by S mode (can also use Pwd or Pass)
; Password=MySecret123


;; Kcp: Global default KCP profile. Options: normal (broadband-friendly), fast (low-latency/RDP), api (strict ping-pong)
;; Default is normal
; Kcp=normal
;; --- Fine-grained KCP Settings (Uncomment with single semicolon to override specific parameters in the Kcp profile above) ---
; KcpNoDelay=false    ;; Enable extreme no-delay mode (disables delayed ACK)
; KcpInterval=40      ;; Internal timer tick interval (ms)
; KcpResend=2         ;; Fast retransmit threshold (0 to disable)
; KcpNc=0             ;; Disable congestion control (0 = enabled, 1 = disabled)
; KcpSndWnd=512       ;; KCP Send Window Size
; KcpRcvWnd=512       ;; KCP Receive Window Size

;; Mtu: Maximum Transmission Unit (Default 1400)
; Mtu=1400
;; RegTimeout: Time in seconds before P-Mode considers S-Mode disconnected (Default 600)
; RegTimeout=600
;; RegInterval: Interval in seconds for S-Mode heartbeat to P-Mode (Default 300)
; RegInterval=300
;; Timeout: Global session idle timeout to drop dead connections (seconds, Default 300, 0 for no limit)
; Timeout=300

;; ==========================================
;; [Client Configuration (C-Mode)] 
;; Syntax: listen_port/protocol = target_name@proxy_server_address
;; Example: Listen on local port 33890 and forward to S-Mode target 'rdp_home' via P-Mode server.
; 33890/tcp = rdp_home@your_proxy_ip.com

;; ==========================================
;; [Server Configuration (S-Mode)]
;; Each [bracket] represents a target service to be published.

;; Example: Publish local Remote Desktop (RDP) service
; [rdp_home]
; target=127.0.0.1:3389/tcp
; server=your_proxy_ip.com
;; Use the low-latency profile optimized for RDP
; kcp=fast

;; Example: Publish a local Web API, optimized for request/response API patterns
; [web_api]
; target=192.168.1.100:80/tcp
; server=your_proxy_ip.com
; kcp=api
;; Local override: Session idle timeout to drop dead connections (Default 300)
; timeout=300 

