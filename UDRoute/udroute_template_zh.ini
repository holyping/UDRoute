;; UDRoute Configuration Template
;; ==========================================
;; 双分号(;;)为说明文本，单分号(;)为被注释的配置项

;; [全局配置]
;; DevId: 设备唯一标识，用于在 P 端区分设备 (自动生成)，这是唯一必填项！
DevId={DevId}

;; --- 以下均为可选配置，程序均自带最佳默认值，可按需取消单分号注释 ---

;; DevName: 设备名称 (默认使用机器名)
    ; DevName=MyComputer
;; Port: 监听端口 (默认P模式或本地通信端口为 9400)
    ; Port=9400
;; WanPort: 绑定的外网公网端口 (默认 0，仅在手动配置NAT端口映射时使用)
    ; WanPort=0

;; LogLevel: 日志级别 (trace/debug/info/warn/error/none，默认 warn)
    ; LogLevel=warn
;; LogType: 日志输出 (console/file/eventlog/default，默认 default)
    ; LogType=default
;; LogFile: 自定义日志文件路径 (仅在 LogType=file 时有效)
    ; LogFile=udroute.log

;; ==========================================
;; [代理中继与安全配置 (P端 / Proxy)]
;; ==========================================
;; AuthMode: P端认证模式 (none / strict / optional，默认 none)
;; none: 允许所有人注册
;; strict: (级别1) 仅允许鉴权通过的 S 端注册
;; optional: (级别2) 允许无密码注册，但有密码的不能被无密码覆盖，实现防恶意抢占
    ; AuthMode=none
;; AuthFile: P端的密码本文件路径 (如果不填，默认为 本配置文件名.pwd)
    ; AuthFile=udroute.pwd

;; AllowUnauthRelay: 是否允许S非鉴权用户使用P转发 (default / allow / deny，默认 default)
;; default: 如果P未配置预定义用户(密码本为空)，则允许转发；若已配置预定义用户，则不允许转发
;; allow: 始终允许非鉴权用户使用P转发
;; deny: 禁止非鉴权用户使用P转发，必须通过UDP洞穿直连(若洞穿失败则断开连接)
    ; AllowUnauthRelay=default

;; MaxUnauthNamesPerUser: 限制单个S非鉴权用户注册的name数量 (默认 20，0为不限制)
    ; MaxUnauthNamesPerUser=20

;; MaxUnauthNamesTotal: 限制所有S非鉴权用户注册的name总数量 (默认 2000，0为不限制)
    ; MaxUnauthNamesTotal=2000

;; RegTimeout: P端判定S端掉线的超时时间 (秒，默认 600)
    ; RegTimeout=600

;; ==========================================
;; [身份认证配置 (S端向P端注册)]
;; ==========================================
;; Username: S端发起注册时使用的用户名 (P端需要在密码本配置此用户)
    ; Username=zhangsan
;; Password: S端发起注册时的密码 (也可使用 Pwd 或 Pass 代替)
    ; Password=MySecret123

;; ==========================================
;; [网络传输与会话调优 (S端默认值与全局)]
;; ==========================================
;; 以下参数作为全局/默认值，各 [S端具体服务] 未单独配置时将自动继承：

;; Kcp: 全局默认的 KCP 预设模式。可选值：normal（宽带友好）、fast（低延迟/远程桌面）、realtime（极致Ping-Pong）
;; 默认值为 normal
    ; Kcp=normal
;; --- KCP 精细化设置 (可取消单分号注释以单独覆盖上述 Kcp 预设中的某个参数) ---
    ; KcpNoDelay=false    ;; 是否开启极端无延迟模式 (取消延迟ACK)
    ; KcpInterval=40      ;; 内部定时器轮询间隔 (毫秒)
    ; KcpResend=2         ;; 快速重传触发条件 (跳过几个ACK重传，0为关闭)
    ; KcpNc=0             ;; 是否关闭拥塞控制 (0为开启流控，1为关闭流控)
    ; KcpSndWnd=512       ;; KCP 发送窗口大小
    ; KcpRcvWnd=512       ;; KCP 接收窗口大小

;; Mtu: 最大传输单元 (默认 1400)
    ; Mtu=1400
;; RegInterval: S端向P端发送心跳包的间隔 (秒，默认 300)
    ; RegInterval=300
;; Timeout: 全局的会话空闲断开时间 (秒，默认 300, 0 为不限制)
    ; Timeout=300

;; TunnelReuseInterval: 数据通道复用保持时间 (秒，默认 300，0 为仅在活跃时复用，空闲立即关闭不延迟保持)
;; 相同C到S的服务组合未超时可复用通道免除握手；连接全部断开后通道延迟此时间后关闭 (0为立即关闭)
    ; TunnelReuseInterval=300

;; ==========================================
;; [C端配置 (Client)] 
;; ==========================================
;; 请参考命令行 `udroute -h` 获取详细的 [C端语法] 规则。
;; 简要语法: 监听端口/协议 = 目标服务名[:密码]@代理服务器地址

;; 示例: 监听本地 33890 端口，并将其通过 P端转发到名为 rdp_home 的 S端
    ; 33890/tcp = rdp_home@your_proxy_ip.com
;; 示例: 带有密码保护的服务
    ; 8080/tcp = web_secret:my_password@your_proxy_ip.com

;; ForceRelay: 强制走中转模式，禁用 UDP 直连打洞 (true/false，默认 false)
;; 注意：若目标 S 端或 P 端不允许中继 (AllowRelay=false)，因冲突将自动忽略 ForceRelay 并继续执行直连打洞
    ; ForceRelay=false

;; ==========================================
;; [S端配置 (Server)]
;; ==========================================
;; 请参考命令行 `udroute -h` 中的 [S端语法] 获取不同协议的 target 配置规则。
;; 每个 [中括号] 代表一个需要被别人访问的目标服务名

;; 示例: 发布本地的远程桌面服务
    ; [rdp_home]
    ; target=127.0.0.1:3389/tcp
    ; server=your_proxy_ip.com
;; 是否允许该服务通过 P 端进行中继 (true/false，默认 true)
;; 若设置为 false，则该服务仅允许 UDP 直连打洞访问；若 C 端配置了 ForceRelay 将自动忽略
    ; allowrelay=true
;; 局部鉴权：仅该服务使用特定的账号密码进行P端鉴权(若不填则默认使用全局 Username/Password)
    ; username=rdp_user
;; 通信密码：用于防止未授权的C端连接，C端必须提供同样的密码才能打通数据通道
    ; password=rdp_pass
;; 针对远程桌面的低延迟优化 (使用fast预设)
    ; kcp=fast

;; 示例: 发布一个 Web API 服务，针对 API 请求/响应模式进行优化
    ; [web_api]
    ; target=192.168.1.100:80/tcp
    ; server=your_proxy_ip.com
    ; kcp=normal
;; 局部覆盖：会话空闲断开时间 (默认 300)
    ; timeout=300 
;; 局部覆盖：数据通道复用保持时间 (秒，默认继承全局设置)
    ; TunnelReuseInterval=300 

;; 示例: 发布一个远程文件目录 (File 协议)
    ; [my_files]
    ; target=D:\Data\Shared;/file
    ; server=your_proxy_ip.com
;; 是否只读 (禁止客户端执行 push 命令上传文件)
    ; readonly=true
;; 保护密码
    ; password=SecretFilePass
