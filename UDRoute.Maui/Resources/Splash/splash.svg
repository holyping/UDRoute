<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 绝杀招：在四个角落放极小且颜色与背景完全相同的实体点。
       SkiaSharp 发现有实体像素，就会老老实实把画布当做 512x512，绝不会再放大！ -->
  <circle cx="2" cy="2" r="2" fill="#512BD4" />
  <circle cx="510" cy="510" r="2" fill="#512BD4" />
  <circle cx="2" cy="510" r="2" fill="#512BD4" />
  <circle cx="510" cy="2" r="2" fill="#512BD4" />
  
  <!-- 将六边形整体缩小至原先的 80%，留出极其充裕的安全边距 -->
  <polygon points="256,128 366,192 366,320 256,384 146,320 146,192" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linejoin="round" />
  <circle cx="146" cy="192" r="20" fill="#38BDF8" />
  <circle cx="366" cy="320" r="20" fill="#38BDF8" />
  <path d="M 146 192 L 366 320" fill="none" stroke="#38BDF8" stroke-width="20" stroke-dasharray="16 16" />
</svg>